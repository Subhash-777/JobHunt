<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobHunt India</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 480px;
      background: #0f0f1a;
      color: #e8e6e3;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    /* ── Header ───────────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo { font-size: 28px; }
    .header-text h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .header-text p  { font-size: 11px; color: rgba(255,255,255,0.8); }

    /* ── Status pill ─────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    .status-dot.offline { background: #ef4444; animation: none; }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
    .status-text { font-size: 12px; color: #9a9896; }
    .status-text strong { color: #e8e6e3; }

    /* ── Profile card ─────────────────────────────────────────── */
    #profile-card {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6B35, #FF8C42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .profile-info { flex: 1; overflow: hidden; }
    .profile-name  { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-email { font-size: 11px; color: #9a9896; }
    .profile-score {
      background: rgba(255,107,53,0.15);
      color: #FF6B35;
      border: 1px solid rgba(255,107,53,0.3);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
    }

    /* ── Not logged in ────────────────────────────────────────── */
    #login-prompt {
      padding: 24px 20px;
      text-align: center;
    }
    #login-prompt .icon { font-size: 40px; margin-bottom: 12px; }
    #login-prompt h3 { font-weight: 600; margin-bottom: 6px; }
    #login-prompt p  { font-size: 12px; color: #9a9896; margin-bottom: 16px; }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #FF6B35, #FF8C42);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }

    /* ── Action grid ─────────────────────────────────────────── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      color: #e8e6e3;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }
    .action-btn:hover {
      background: rgba(255,107,53,0.1);
      border-color: rgba(255,107,53,0.3);
      transform: translateY(-1px);
    }
    .action-btn .icon { font-size: 22px; }
    .action-btn.disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn.disabled:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); transform: none; }

    /* ── Stats strip ─────────────────────────────────────────── */
    #stats-strip {
      display: flex;
      padding: 12px 20px;
      gap: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .stat-item {
      flex: 1;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 700; color: #FF6B35; }
    .stat-label { font-size: 10px; color: #9a9896; margin-top: 2px; }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-link {
      font-size: 11px;
      color: #9a9896;
      text-decoration: none;
      cursor: pointer;
    }
    .footer-link:hover { color: #FF6B35; }

    /* ── Toast ───────────────────────────────────────────────── */
    #popup-toast {
      display: none;
      margin: 0 20px 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    #popup-toast.success { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    #popup-toast.error   { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }

    /* ── Loading skeleton ────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">🎯</div>
    <div class="header-text">
      <h1>JobHunt India</h1>
      <p>Your AI-powered career companion</p>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-text" id="status-text">Checking session…</div>
  </div>

  <!-- Main content (toggled by auth state) -->
  <div id="main-content" style="display:none;">

    <!-- Profile card -->
    <div id="profile-card">
      <div class="avatar" id="profile-avatar">👤</div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">Loading…</div>
        <div class="profile-email" id="profile-email"></div>
      </div>
      <div class="profile-score" id="profile-score">—%</div>
    </div>

    <!-- Stats strip -->
    <div id="stats-strip">
      <div class="stat-item">
        <div class="stat-value" id="stat-saved">—</div>
        <div class="stat-label">Saved</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-applied">—</div>
        <div class="stat-label">Applied</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-interviews">—</div>
        <div class="stat-label">Interviews</div>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="actions">
      <button class="action-btn" id="btn-save-job">
        <span class="icon">📌</span>
        Save Job
      </button>
      <button class="action-btn" id="btn-autofill">
        <span class="icon">✍️</span>
        Autofill Form
      </button>
      <button class="action-btn" id="btn-tracker">
        <span class="icon">📊</span>
        Open Tracker
      </button>
      <button class="action-btn" id="btn-jobs">
        <span class="icon">🔍</span>
        Browse Jobs
      </button>
    </div>

    <!-- Toast -->
    <div id="popup-toast"></div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-link" id="btn-sync">🔄 Sync session</span>
      <span class="footer-link" id="btn-signout">Sign out</span>
    </div>

  </div>

  <!-- Not logged in -->
  <div id="login-prompt" style="display:none;">
    <div class="icon">🔐</div>
    <h3>Sign in to JobHunt</h3>
    <p>Open JobHunt India in your browser and sign in to enable autofill & job capture.</p>
    <button class="btn-primary" id="btn-open-app">Open JobHunt India →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
